[workspace]

[package]
name = "stm32-periph-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Default build (wasm-pack / browser) keeps the wasm-bindgen JS export layer.
# The Emscripten merge build (native_model_capi) disables this so the model
# exposes plain `pub fn`s that link into Unicorn's wasm without the
# wasm-bindgen runtime (which cannot be linked into an Emscripten module).
default = ["wasm-bindgen"]
wasm-bindgen = ["dep:wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
log = "0.4"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = { version = "0.1", optional = true }
svd-parser = "0.13"
aes = "0.8"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
des = "0.8"

